# IRCC Tracker + PostgreSQL. Configure everything in .env (see .env.example), then:
#   docker compose up -d
# Uses the prebuilt image; add --build to build it from this folder instead.
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ircc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ircc
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ircc -d ircc"]
      interval: 5s
      timeout: 5s
      retries: 10

  tracker:
    image: ghcr.io/hermanl02/ircc-tracker:latest
    build: .
    # Google Chrome only ships x86-64 Linux builds.
    platform: linux/amd64
    restart: unless-stopped
    # tini as PID 1 reaps Chrome's child processes.
    init: true
    # Chrome needs more shared memory than Docker's 64 MB default.
    shm_size: 1gb
    env_file: .env
    # These override .env so the container talks to the postgres service above.
    environment:
      DATABASE_URL: postgres://ircc:${POSTGRES_PASSWORD}@postgres:5432/ircc
      HOST: 0.0.0.0
      PORT: "3000"
      BROWSER_PROFILE_DIR: /data/browser-profile
    ports:
      # API on this machine only. Change to "3460:3000" to expose it on your network.
      - "127.0.0.1:${API_PORT:-3460}:3000"
    volumes:
      - browser-profile:/data/browser-profile
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  browser-profile:
