# Coolify: "Docker Compose" build pack, base directory "/".
# SERVICE_* values are generated by Coolify; set the others under Environment Variables.
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${SERVICE_USER_POSTGRES}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_64_POSTGRES}
      - POSTGRES_DB=ircc
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  tracker:
    build: .
    restart: unless-stopped
    # tini as PID 1 reaps Chrome's child processes.
    init: true
    # Chrome needs more shared memory than Docker's 64 MB default.
    shm_size: 1gb
    environment:
      - SERVICE_URL_TRACKER_3000
      - DATABASE_URL=postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_64_POSTGRES}@postgres:5432/ircc
      - API_KEYS=${SERVICE_PASSWORD_64_APIKEY}
      - GCKEY_USERNAME=${GCKEY_USERNAME:?}
      - GCKEY_PASSWORD=${GCKEY_PASSWORD:?}
      - GCKEY_TOTP_SECRET=${GCKEY_TOTP_SECRET:?}
      - IRCC_SURNAME=${IRCC_SURNAME:?}
      - IRCC_GIVEN_NAME=${IRCC_GIVEN_NAME:?}
      - IRCC_UCI=${IRCC_UCI:?}
      - IRCC_APPLICATION_NUMBER=${IRCC_APPLICATION_NUMBER:?}
      - IRCC_DATE_OF_BIRTH=${IRCC_DATE_OF_BIRTH:?}
      - IRCC_COUNTRY_OF_BIRTH=${IRCC_COUNTRY_OF_BIRTH:?}
      - BROWSER_PROXY_URL=${BROWSER_PROXY_URL:-}
      - CHECK_CRON=${CHECK_CRON:-17 */2 * * *}
      - CHECK_TIMEZONE=${CHECK_TIMEZONE:-UTC}
      - CHECK_ON_BOOT=${CHECK_ON_BOOT:-true}
      - USESEND_API_URL=${USESEND_API_URL:-}
      - USESEND_API_KEY=${USESEND_API_KEY:-}
      - NOTIFY_EMAIL_TO=${NOTIFY_EMAIL_TO:-}
      - NOTIFY_EMAIL_FROM=${NOTIFY_EMAIL_FROM:-}
      - NOTIFY_ERROR_AFTER=${NOTIFY_ERROR_AFTER:-2}
    volumes:
      - browser-profile:/data/browser-profile
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  browser-profile:
